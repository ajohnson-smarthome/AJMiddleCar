name: AJMiddleCar
options:
  bundleIdPrefix: com.adamjohnson
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AJMiddleCar:
    type: application
    platform: iOS
    sources:
      - AJMiddleCar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adamjohnson.ajmiddlecar
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: AJMiddleCar/Info.plist
    info:
      path: AJMiddleCar/Info.plist
      properties:
        CFBundleDisplayName: AJ Middle
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Connects to the AJMiddleCar over local Wi-Fi to drive it."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  AJMiddleCarTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AJMiddleCarTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: AJMiddleCar
schemes:
  AJMiddleCar:
    build:
      targets:
        AJMiddleCar: all
        AJMiddleCarTests: [test]
    test:
      targets:
        - AJMiddleCarTests
